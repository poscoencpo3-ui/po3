# Render 블루프린트: 저장소를 연결하면 이 설정대로 웹 서비스가 만들어집니다.
services:
  - type: web
    name: pingpong-arena
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false
