<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새봄이·새별이 영어 교실 — 자동 생성기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>새봄·새별 영어 워크북</h1>
      <p>회차를 고르고 인쇄하면 오늘의 학습지가 완성됩니다</p>
    </header>

    <div class="student-tabs">
      <button class="student-tab" data-student="saebom">새봄 (초2)</button>
      <button class="student-tab" data-student="saebyul">새별 (6세)</button>
    </div>

    <div class="panel">
      <h3>학습 현황판</h3>
      <div class="dashboard">
        <div class="dash-col">
          <h4>지난 회차</h4>
          <div class="dash-list" id="pastList"></div>
        </div>
        <div class="dash-col dash-today">
          <h4>오늘의 회차</h4>
          <div id="todayCard"></div>
        </div>
        <div class="dash-col">
          <h4>앞으로 남은 회차</h4>
          <div class="dash-list" id="upcomingList"></div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button id="printBtn">인쇄 / PDF 저장</button>
      <button id="completeBtn">이 회차 완료 표시하기</button>
      <button id="resetBtn">진도 초기화</button>
    </div>

    <div id="worksheet"></div>
  </div>

  <script src="js/characters.js"></script>
  <script src="js/curriculum-saebom.js"></script>
  <script src="js/curriculum-saebyul.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
